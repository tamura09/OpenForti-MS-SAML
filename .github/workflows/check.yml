name: Check dependencies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    strategy:
      matrix:
        node: [18, 24]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Verify dependency APIs without logging in
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          assert.equal(typeof require('puppeteer').launch, 'function');
          assert.equal(typeof require('otplib').authenticator.generate, 'function');
          assert.equal(typeof require('node:timers/promises').setTimeout, 'function');
          JS
